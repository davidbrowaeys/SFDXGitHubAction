name: Syensqo Salesforce Pipeline

on:
  pull_request:
    # Triggers on PRs targeting develop or release branches
    branches:
      - develop
      - "release/**"
  push:
    # Triggers on Pushes directly to develop or release branches
    branches:
      - develop
      - "release/**"

jobs:
  validate_qa:
    name: ✅ Validate to QA

    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: QA
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: true
      run-data-import: false
      runjest: true

    secrets: inherit

  # --- 2. Deploy QA (merge to develop)
  deploy_qa:
    name: 🚀 Deploy to QA

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: QA
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
      runjest: true

    secrets: inherit

  validate_sit:
    name: ✅ Validate to SIT

    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') }}

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: SIT
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: true
      run-data-import: false
      runjest: true

    secrets: inherit

  # --- 4. Deploy SIT (merge to release/*)
  deploy_sit:
    name: 🚀 Deploy to SIT

    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'release/') }}

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: SIT
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
      runjest: true

    secrets: inherit

  ############   UAT STAGE ##########################################################
  # UAT deployment requires manual approval before validation and deployment
  # Flow: SIT Deploy → (Approval) → UAT Validate → (Approval) → UAT Deploy

  # --- 5. Validate UAT (after SIT deployment, requires approval)
  validate_uat:
    name: ✅ Validate to UAT
    needs: deploy_sit

    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'release/') }}

    environment:
      name: UAT-Validation

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: UAT
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: false
      run-data-import: false

    secrets: inherit

  # --- 6. Deploy UAT (after UAT validation, requires approval)
  deploy_uat:
    name: 🚀 Deploy to UAT
    needs: validate_uat

    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'release/') }}

    environment:
      name: UAT-Deployment

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: UAT
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false

    secrets: inherit

  ############   PRODUCTION STAGE ##########################################################
  # PROD deployment requires manual approval before validation and deployment
  # Flow: UAT Deploy → (Approval) → PROD Validate → (Approval) → PROD Deploy
  # After successful PROD deployment, merge release/* to main manually

  # --- 7. Validate PROD (after UAT deployment, requires approval)
  validate_prod:
    name: ✅ Validate to PROD
    needs: deploy_uat

    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'release/') }}

    environment:
      name: PROD-Validation

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: PROD
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: true
      run-data-import: false
      runjest: true

    secrets: inherit

  # --- 8. Deploy PROD (after PROD validation, requires approval)
  # NOTE: After this deployment succeeds, manually merge release/* to main
  # to keep main branch as a mirror of production
  deploy_prod:
    name: 🚀 Deploy to PROD
    needs: validate_prod

    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'release/') }}

    environment:
      name: PROD-Deployment

    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main

    with:
      target-env: PROD
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
      runjest: false

    secrets: inherit
