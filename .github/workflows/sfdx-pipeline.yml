name: Syensqo Salesforce Pipeline

on:
  pull_request:
    branches:
      - develop
      - "release/**"
  push:
    branches:
      - develop
      - "release/**"

jobs:
  validate_qa:
    name: ✅ Validate to QA
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: QA
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: true
      run-data-import: false
      runjest: true
    secrets: inherit

  deploy_qa:
    name: 🚀 Deploy to QA
    if: github.event_name == 'push' && github.ref_name == 'develop'
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: QA
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
      runjest: true
    secrets: inherit

  validate_sit:
    name: ✅ Validate to SIT
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: SIT
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: true
      run-data-import: false
      runjest: true
    secrets: inherit

  deploy_sit:
    name: 🚀 Deploy to SIT
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: SIT
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
      runjest: true
    secrets: inherit

  validate_uat:
    name: ✅ Validate to UAT
    needs: deploy_sit
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: UAT # This triggers the "UAT" environment in the reusable workflow
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: false
      run-data-import: false
    secrets: inherit

  deploy_uat:
    name: 🚀 Deploy to UAT
    needs: validate_uat
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: UAT
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
    secrets: inherit

  validate_prod:
    name: ✅ Validate to PROD
    needs: deploy_uat
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: PROD
      deployment-mode: "DELTA"
      check-only: true
      run-code-scanner: true
      run-data-import: false
      runjest: true
    secrets: inherit

  deploy_prod:
    name: 🚀 Deploy to PROD
    needs: validate_prod
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
    uses: davidbrowaeys/SafireForGitHub/.github/workflows/continuous-integration.yml@main
    with:
      target-env: PROD
      deployment-mode: "DELTA"
      check-only: false
      run-code-scanner: false
      run-data-import: false
      runjest: false
    secrets: inherit
